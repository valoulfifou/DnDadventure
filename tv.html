<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" href="icons/mj-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/mj-192.png">
<link rel="manifest" href="manifest-mj.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D&amp;D TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Écran TV · Table de Combat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
:root{--ink:#f2e6c8;--gold:#e2b866}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,#2a2218,#000 75%);color:var(--ink);font-family:Alegreya,Georgia,serif;display:grid;place-items:center;padding:24px}
main{text-align:center;max-width:620px;width:100%}
h1{font-family:'Alegreya Sans SC',sans-serif;letter-spacing:.14em;color:var(--gold);font-size:clamp(30px,5vw,52px);margin:0 0 8px}
p{font-size:clamp(17px,2.2vw,22px);margin:6px 0 22px;opacity:.85}
input{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:clamp(28px,5vw,48px);letter-spacing:.25em;text-align:center;text-transform:lowercase;padding:14px;border-radius:10px;border:2px solid var(--gold);background:#120e09;color:var(--ink)}
input:focus{outline:3px solid #fff3;outline-offset:3px}
button{margin-top:18px;font-family:'Alegreya Sans SC',sans-serif;letter-spacing:.1em;font-size:clamp(20px,3vw,28px);padding:14px 34px;border-radius:10px;border:0;background:var(--gold);color:#1a140c;cursor:pointer}
button:focus{outline:3px solid #fff;outline-offset:3px}
.err{color:#ff9b8a;min-height:1.4em;font-size:18px;margin-top:12px}
</style></head>
<body><main>
<h1>Écran TV</h1>
<p>Tape le code de la table affiché sur la tablette du MJ (bouton « Écran TV »).</p>
<form id="f"><input id="c" maxlength="8" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="code" aria-label="Code de la table" autofocus>
<button type="submit">Afficher la carte</button><div class="err" id="e" role="alert"></div></form>
<p id="ua" style="position:fixed;bottom:8px;left:0;right:0;font:12px monospace;opacity:.35;margin:0;text-align:center"></p></main>
<script>
document.getElementById('ua').textContent=navigator.userAgent;
var c=document.getElementById('c'),e=document.getElementById('e');
try{c.value=localStorage.getItem('tdc-tv-code')||''}catch(_){}
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var v=c.value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(v.length!==8){e.textContent='Le code fait 8 caractères.';return}
  try{localStorage.setItem('tdc-tv-code',v)}catch(_){}
  location.href='tv-app.html?tv='+v+(/[?&]test/.test(location.search)?'&test=1':'')};
</script>
</body></html>
