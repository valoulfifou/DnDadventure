<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout : une fiche façon bloc de stats illustré — papier crème, arche centrale avec le portrait, chaînes d'ovales de part et d'autre ; une colonne, barre du bas fine */
:root{
  --paper:#f2ede3; --paper-2:#e8e0cf; --card:#fbf8f2; --ink:#45362a; --muted:#8a7a68; --line:#cbbca4; --line-2:#a8957b;
  --teal:#3e6a68; --umber:#4d4036; --dark:#5b4a3c; --gold:#e3b52c; --accent:#8c2f2b; --accent-ink:#f8f3ea; --ok:#4f7d4b; --warn:#a8711c; --foe:#8c2f2b; --spell:#3e6a68;
  --f-display:"Alegreya Sans SC", "Alegreya Sans", Georgia, serif;
  --f-body:"Alegreya", Georgia, "Times New Roman", serif;
  --f-mono:"Alegreya Sans SC", Georgia, serif;
  color-scheme:light;
}
html,body{min-height:100%;overflow-x:clip}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  background:repeating-radial-gradient(circle at 18% 22%,transparent 0 11px,rgba(140,120,90,.07) 11px 12px),repeating-radial-gradient(circle at 82% 78%,transparent 0 13px,rgba(140,120,90,.06) 13px 14px),var(--paper)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:lining-nums tabular-nums}
h1,h2,h3{margin:0}
.scene{max-width:760px;margin:0 auto;overflow-x:clip}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 104px;display:flex;flex-direction:column;gap:16px;min-width:0}

.brand{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.06em;line-height:1;text-align:center;color:var(--umber)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
.sub{color:var(--muted);font-size:15px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:6px;padding:8px 13px;font-size:15px;line-height:1.1;font-family:var(--f-display);letter-spacing:.04em;box-shadow:0 1px 0 var(--line)}
.btn:hover{border-color:var(--umber)}
.btn.primary{background:var(--umber);color:var(--accent-ink);border-color:var(--umber);font-weight:700}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{position:relative;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;background:rgba(251,248,242,.78);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 0 var(--line)}
.card h3{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;color:var(--umber);display:flex;align-items:center;gap:10px;text-align:center}
.card h3::before,.card h3::after{content:"";flex:1;height:1px;background:var(--line)}
details.card>summary{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;color:var(--umber);cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0;font-family:var(--f-display);letter-spacing:.05em}
.fld input,.fld select,.fld textarea,.in{border:1px solid var(--line-2);background:var(--card);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%;font-size:16px;font-family:var(--f-body);letter-spacing:0}
.fld textarea{min-height:120px;resize:vertical}
.fld input:disabled{opacity:.5}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{accent-color:var(--teal);width:18px;height:18px}
.empty{color:var(--muted);font-style:italic}

/* Liste */
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 1px 0 var(--line)}
.pc:hover{border-color:var(--line-2)}
.pcrow{display:flex;gap:8px;align-items:stretch}.pcrow .pc{flex:1;min-width:0}.pcdel{flex:none;color:var(--foe,#a33);border-color:currentColor;align-self:center}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:20px;background-size:cover;background-position:center 20%;box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--line-2)}
.pc .nm{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.05;letter-spacing:.03em}
.pc .ds{font-size:14px;color:var(--muted)}
.hero{display:flex;gap:12px;align-items:center}
.hero .nm{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.02;letter-spacing:.03em}
.hero .ds{font-size:14px;color:var(--muted)}

/* Bloc de stats (mode combat) */
.stat{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
.pname{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.04em;color:var(--umber);text-align:center;text-wrap:balance;margin-bottom:-6px}
.kicker{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:14px;color:var(--umber);text-align:center;text-wrap:balance}
.kicker span{color:var(--accent)}
.tags{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);align-items:center;gap:10px;width:100%;max-width:420px}
.pill{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:13px;color:#f3ede2;text-align:center;padding:7px 8px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),0 2px 3px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.teal{background:linear-gradient(180deg,#4b7b78,#345a58)}.pill.umb{background:linear-gradient(180deg,#5d4f44,#3f342b)}
.d20 svg{width:56px;height:56px;display:block;filter:drop-shadow(0 3px 3px rgba(80,60,20,.35))}
.cflags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cf{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:2px 7px;background:var(--card)}
.arena{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:8px;align-items:start;width:100%;max-width:520px}
.ovs{display:flex;flex-direction:column;align-items:center;padding-top:22px}
.ovl{width:56px;height:70px;border-radius:50%;background:var(--card);border:1.5px solid var(--line-2);box-shadow:0 0 0 4px var(--paper),0 0 0 5.5px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:-5px 0;position:relative}
.ovl b{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;color:var(--muted)}
.ovl small{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;color:var(--line-2)}
.arch{position:relative;aspect-ratio:3/4;border:1.5px solid var(--line-2);border-radius:50% 50% 10px 10px/34% 34% 10px 10px;box-shadow:0 0 0 6px var(--paper),0 0 0 7.5px var(--line);
  background:radial-gradient(ellipse at 50% 38%,var(--card),var(--paper-2));margin-bottom:46px}
.porclip{position:absolute;left:-30%;right:-30%;top:-20%;bottom:-8px;overflow:hidden;z-index:1;pointer-events:none}
.arch .por{position:absolute;left:50%;top:11.7%;width:77.5%;height:auto;transform-origin:50% 30%;filter:drop-shadow(0 6px 6px rgba(50,35,20,.3))}
.arch .mono-por{position:absolute;inset:0 0 30%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:min(22vw,110px);color:var(--line);letter-spacing:.04em}
.acb{position:absolute;left:50%;bottom:44px;width:86px;transform:translateX(-50%);z-index:2}
.acb svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(50,35,20,.3))}
.hpb{position:absolute;left:-16%;right:-16%;bottom:-46px;z-index:3}
.hpb svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 3px rgba(30,40,40,.35))}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:420px;text-align:center;align-items:center;margin-top:6px}
.acs{display:flex;justify-content:center;align-items:center}
.acs svg{width:100%;max-width:104px;height:auto;filter:drop-shadow(0 3px 3px rgba(50,35,20,.3))}
.adj{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.adj summary{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;color:var(--umber)}
.adj input[type=range]{width:100%;accent-color:var(--teal);padding:0;border:0;background:none;box-shadow:none}
.perc{font-family:var(--f-display);letter-spacing:.08em;font-size:14px;color:var(--muted);margin-top:-4px}
.perc b{color:var(--ink);font-size:16px}
.circ{display:flex;flex-direction:column;align-items:center;gap:6px}
.circ b{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#6c5948,var(--dark) 60%,#3f3329);color:var(--accent-ink);font-family:var(--f-display);font-size:22px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--dark)}
.circ small{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;font-size:12px;color:var(--umber)}
.saves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px}
.oct{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1/1;max-width:104px;width:100%;justify-self:center;background:var(--card);
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);position:relative}
.oct::before{content:"";position:absolute;inset:0;background:var(--line-2);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%,0 30%,2.5% 31%,2.5% 69%,31% 97.5%,69% 97.5%,97.5% 69%,97.5% 31%,69% 2.5%,31% 2.5%,2.5% 31%,0 30%)}
.oct small{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;color:var(--muted);position:relative}
.oct b{font-family:var(--f-display);font-size:24px;color:var(--ink);position:relative;line-height:1.1}
.oct.pro b{color:var(--teal)}
.oct.pro small::after{content:" ●";color:var(--teal)}
.hpctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hpctl input{width:84px;text-align:center}

/* Fiche */
.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
@media (min-width:560px){.abil{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ab{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.ab .k{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--umber)}
.ab .m{width:58px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--ink);background:var(--card);border:1.5px solid var(--line-2);box-shadow:0 0 0 4px var(--paper),0 0 0 5.5px var(--line)}
.ab input{width:58px;text-align:center;border:1px solid var(--line-2);background:var(--card);border-radius:6px;padding:3px}
.ab .r{font-size:12px;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);text-align:center}
.st .k{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.st .v{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);font-size:15px}
.li:last-child{border-bottom:0}
.li .b{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:36px;text-align:right}
.li small{color:var(--muted);font-family:var(--f-display);letter-spacing:.06em}
.tri{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--card);padding:0}
.tri.p1{background:radial-gradient(circle,var(--teal) 45%,var(--card) 50%)}
.tri.p2{background:var(--teal);box-shadow:0 0 0 3px rgba(62,106,104,.25)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);display:inline-block;background:transparent}
.dot.on{background:var(--teal);border-color:var(--teal)}

/* Actions */
.act{border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;box-shadow:0 1px 2px rgba(80,60,40,.12)}
.act .n{font-family:var(--f-body);font-weight:700;font-size:17px;line-height:1.15}
.act .n::before{content:"»";font-weight:700;margin-right:6px;color:var(--umber)}
.act .roll{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.rl{font-size:14px;color:var(--muted)}
.rl b{color:var(--ink);font-variant-numeric:lining-nums}
.rl+.rl::before{content:"·";margin-right:6px;color:var(--line-2)}
.act .note{grid-column:1/-1;font-size:13px;color:var(--muted);font-style:italic}
.tag{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.tag.action{color:var(--ok)}.tag.bonus{color:var(--warn)}.tag.reaction{color:var(--teal)}
.pips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pip{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--teal);background:var(--teal);padding:0}
.pip.used{background:transparent}
.pip.r{border-color:var(--gold);background:var(--gold)}.pip.r.used{background:transparent}
.slotrow{display:flex;align-items:center;gap:8px;font-size:14px}
.slotrow .lv{width:74px;color:var(--muted);font-family:var(--f-display);letter-spacing:.05em}
.conds{display:flex;gap:5px;flex-wrap:wrap}
.cond{border:1px solid var(--line-2);background:var(--card);border-radius:4px;padding:3px 9px;font-size:13px;font-family:var(--f-display);letter-spacing:.05em}
.cond.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:3px 9px;background:var(--card);font-style:italic}
.death{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.dp{width:22px;height:22px;border-radius:50%;padding:0;background:var(--card);border:1.5px solid var(--line-2)}
.dp.s{border-color:var(--ok)}.dp.s.on{background:var(--ok)}
.dp.f{border-color:var(--accent)}.dp.f.on{background:var(--accent)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}

/* ---------- Calculs ---------- */
function calc(c){
  const R=RACES[c.race]||RACES.autre,K=CLASSES[c.cls]||CLASSES.guerrier,L=Math.max(1,Math.min(20,+c.level||1));
  const asi={...R.asi};if(R.pick)(c.raceAsi||[]).slice(0,2).forEach(s=>{asi[s]=(asi[s]||0)+1});
  const score={},mod={};STATS.forEach(s=>{score[s]=(+c.base[s]||10)+(asi[s]||0);mod[s]=Math.floor((score[s]-10)/2)});
  const prof=2+Math.floor((L-1)/4);
  const saves={};STATS.forEach(s=>saves[s]=mod[s]+(K.sv.includes(s)?prof:0));
  const skill={};SKILLS.forEach(([n,s])=>skill[n]=mod[s]+prof*(c.skills[n]||0));
  const avg=K.hd/2+1,HR=c.hpRolls||{};let hpL=0;for(let l=2;l<=L;l++)hpL+=Math.max(1,(HR[l]??avg)+mod.CON);const hpAuto=Math.max(L,K.hd+mod.CON+hpL+(R.hpL?L:0));
  const hpMax=+c.hpMax||hpAuto;
  const A=ARMORS[c.armor]||ARMORS.aucune;let ac;
  if(c.armor==='aucune'&&K.ua&&!(c.cls==='moine'&&c.shield))ac=10+mod.DEX+mod[K.ua];else ac=A.b+Math.min(mod.DEX,A.dex);
  ac+=(c.shield?2:0)+(+c.acBonus||0);if(c.acOverride)ac=+c.acOverride;
  let spd=R.spd;if(c.cls==='moine'&&c.armor==='aucune'&&!c.shield&&L>=2)spd+=[0,0,3,3,3,3,4.5,4.5,4.5,4.5,6,6,6,6,7.5,7.5,7.5,7.5,9,9,9][L];
  if(c.cls==='barbare'&&L>=5&&!A.heavy)spd+=3;if(c.speedOverride)spd=+c.speedOverride;
  const init=mod.DEX+(+c.initBonus||0);
  const cast=K.cast?{stat:K.cast,mod:mod[K.cast],dc:8+prof+mod[K.cast],atk:prof+mod[K.cast]}:null;
  let slots=[],pact=null;
  if(K.type==='full')slots=FULL[L];if(K.type==='half')slots=L>=2?FULL[Math.ceil(L/2)]:[];
  if(K.type==='pact')pact={n:L===1?1:L<=10?2:L<=16?3:4,lvl:Math.min(5,Math.ceil(L/2))};
  const res=[],rem=[];
  const R_=(key,name,max,rest,note)=>res.push({key,name,max,rest,note});
  switch(c.cls){
    case 'barbare':R_('rage','Rage',L<3?2:L<6?3:L<12?4:L<17?5:L<20?6:99,'long',`+${L<9?2:L<16?3:4} aux dégâts de FOR · résistance contondant/perforant/tranchant`);if(L>=2)rem.push('Attaque téméraire');break;
    case 'barde':R_('insp','Inspiration bardique',Math.max(1,mod.CHA),L>=5?'court':'long',`d${L<5?6:L<10?8:L<15?10:12} à donner à un allié`);break;
    case 'clerc':if(L>=2)R_('cd','Conduit divin',L<6?1:L<18?2:3,'court','Renvoi des morts-vivants…');break;
    case 'druide':if(L>=2)R_('fs','Forme sauvage',2,'court','');break;
    case 'ensorceleur':if(L>=2)R_('ps','Points de sorcellerie',L,'long','');break;
    case 'guerrier':R_('ss','Second souffle',1,'court',`Action bonus : récupère 1d10 + ${L} PV`);if(L>=2)R_('fa','Fougue',L>=17?2:1,'court','Une action supplémentaire pendant ton tour');if(L>=9)R_('ind','Indomptable',L>=17?3:L>=13?2:1,'long','Relance un JdS raté');break;
    case 'moine':if(L>=2)R_('ki','Points de ki',L,'court','Déluge de coups, Défense patiente, Pas du vent');rem.push(`Arts martiaux d${L<5?4:L<11?6:L<17?8:10}`);break;
    case 'paladin':R_('imp','Imposition des mains (PV)',5*L,'long','Réserve de PV de soin');R_('sens','Sens divin',1+Math.max(0,mod.CHA),'long','');if(L>=3)R_('cd','Conduit divin',1,'court','');if(L>=2)rem.push('Châtiment divin : 2d8 radiant +1d8 par niveau d’emplacement au-delà du 1er');break;
    case 'magicien':R_('ra','Restauration arcanique',1,'long',`Récupère des emplacements pour un total de ${Math.ceil(L/2)} niveaux`);break;
    case 'roublard':rem.push(`Attaque sournoise ${Math.ceil(L/2)}d6`);if(L>=2)rem.push('Ruse : Foncer, Se désengager ou Se cacher en action bonus');break;
  }
  if(L>=5&&['guerrier','barbare','paladin','rodeur','moine'].includes(c.cls))rem.push(c.cls==='guerrier'&&L>=11?`Attaque supplémentaire (${L>=20?4:3} attaques)`:'Attaque supplémentaire (2 attaques)');
  return {R,K,L,asi,score,mod,prof,saves,skill,hpMax,hpAuto,ac,spd,init,cast,slots,pact,res,rem,pp:10+skill['Perception']};
}
const scaleCantrip=(d,L)=>{const m=1+(L>=5)+(L>=11)+(L>=17);return String(d).replace(/^(\d*)d/,(x,n)=>((+n||1)*m)+'d')};
const withMod=(d,m)=>String(d||'').replace(/\bmod\b/g,String(m)).replace(/\+\-/g,'-').replace(/\+0$/,'');
const autoStat=(D,w)=>w.ranged?'DEX':w.finesse?(D.mod.DEX>D.mod.FOR?'DEX':'FOR'):'FOR';
function weaponLine(c,D,w){const st=w.stat&&w.stat!=='auto'&&STATS.includes(w.stat)?w.stat:autoStat(D,w);const m=D.mod[st];
  const atk=m+(w.prof?D.prof:0)+(+w.magic||0)+(+w.atkB||0),dm=(w.noDmgMod?Math.min(0,m):m)+(+w.magic||0)+(+w.dmgB||0);return {atk,dmg:w.dice+(dm?sgn(dm).replace('−','-'):''),st}}
function unarmed(c,D){if(c.cls==='moine'){const m=Math.max(D.mod.FOR,D.mod.DEX),die=`1d${D.L<5?4:D.L<11?6:D.L<17?8:10}`;return {atk:m+D.prof,dmg:die+(m?sgn(m).replace('−','-'):'')}}
  return {atk:D.mod.FOR+D.prof,dmg:String(Math.max(0,1+D.mod.FOR))}}
function spellLine(c,D,s){const L=D.L;let dmg=withMod(s.dmg,D.cast?D.cast.mod:0);if(s.lvl===0&&dmg)dmg=scaleCantrip(dmg,L);return dmg}
function drakeAction(c,D){if(c.race!=='drakeide')return null;const dt=c.dragon||'feu',ln=dt==='acide'||dt==='foudre';return {name:'Souffle draconique',shape:ln?'line':'cone',len:ln?9:4.5,kind:'sort_jds',cost:'action',range:0,area:3,save:DRAKE[dt]||'DEX',dc:8+D.mod.CON+D.prof,dmg:`${D.L<6?2:D.L<11?3:D.L<16?4:5}d6`,dtype:dt,half:true,slot:0,note:'Une fois par repos court ou long.'}}

function itemActs(c,D){const o=[];(c.inv||[]).filter(i=>+i.qty>0&&i.kind).forEach(i=>{const q=+i.qty>1?' ×'+i.qty:'';

function combatSummary(c){const D=calc(c),acts=[];
  c.weapons.forEach(w=>{const l=weaponLine(c,D,w);acts.push({name:w.name,kind:'attaque',cost:'action',range:w.ranged?(+w.range||24):(w.reach?3:1.5),area:0,bonus:l.atk,dc:0,save:'DEX',dmg:l.dmg,dtype:w.dtype,half:true,slot:0,note:[w.thrown?`Lancer : ${w.thrown} m`:'',w.note].filter(Boolean).join(' · ')})});
  const u=unarmed(c,D);acts.push({name:'Mains nues',kind:'attaque',cost:'action',range:1.5,area:0,bonus:u.atk,dc:0,save:'DEX',dmg:u.dmg,dtype:'contondant',half:true,slot:0,note:''});
  const dr=drakeAction(c,D);if(dr)acts.push(dr);
  {const L=D.L,xa=L>=5&&['guerrier','barbare','paladin','rodeur','moine'].includes(c.cls)?(c.cls==='guerrier'?(L>=20?4:L>=11?3:2):2):1;
    if(xa>1)acts.forEach(a=>{if(a.kind==='attaque'&&a.cost==='action'){a.rep=xa;a.repKey='attaque';a.note=[a.note,`Attaque supplémentaire : ${xa} attaques`].filter(Boolean).join(' · ')}});
    if(c.cls==='moine'){const u=unarmed(c,D),base={kind:'attaque',cost:'bonus',range:1.5,area:0,bonus:u.atk,dc:0,save:'DEX',dmg:u.dmg,dtype:'contondant',half:true,slot:0};
      acts.push({...base,name:'Arts martiaux (mains nues)',note:'Après avoir attaqué avec ton action.'});
      if(L>=2){acts.push({...base,name:'Déluge de coups (1 ki)',ki:1,rep:2,repKey:'deluge',note:'Deux attaques à mains nues. Coûte 1 point de ki.'});
        acts.push({name:'Défense patiente (1 ki)',kind:'auto',cost:'bonus',range:0,area:0,bonus:0,dc:0,save:'DEX',dmg:'0',dtype:'',half:true,slot:0,ki:1,note:'Esquiver en action bonus. Coûte 1 point de ki.'});
        acts.push({name:'Pas du vent (1 ki)',kind:'auto',cost:'bonus',range:0,area:0,bonus:0,dc:0,save:'DEX',dmg:'0',dtype:'',half:true,slot:0,ki:1,note:'Foncer ou Se désengager en action bonus, saut doublé. Coûte 1 point de ki.'})}}}
  if(c.cls==='druide'&&D.L>=2){const moon=/lune/i.test(c.sub||'');acts.push({name:'Forme sauvage',kind:'auto',cost:moon?'bonus':'action',range:0,area:0,bonus:0,dc:0,save:'DEX',dmg:'0',dtype:'',half:true,slot:0,ws:{L:D.L,moon},note:'Deux utilisations par repos court. Tu prends les PV, la CA, la vitesse et les attaques de la bête ; à 0 PV tu redeviens druide.'})}
  if(c.cls==='guerrier')acts.push({name:'Second souffle',kind:'soin',cost:'bonus',range:0,area:0,bonus:0,dc:0,save:'DEX',dmg:`1d10+${D.L}`,dtype:'',half:true,slot:0,note:'Une fois par repos court.'});
  if(c.cls==='barbare')acts.push({name:'Rage',kind:'auto',cost:'bonus',range:0,area:0,bonus:0,dc:0,save:'DEX',dmg:'0',dtype:'',half:true,slot:0,note:D.res[0]?.note||''});
  c.spells.filter(s=>s.lvl===0||s.prep).forEach(s=>{const k=s.kind==='autre'?'auto':s.kind;
    acts.push({name:s.name,kind:k,cost:s.cost,range:+s.range||0,area:+s.area||0,bonus:D.cast?D.cast.atk:0,dc:D.cast?D.cast.dc:10,save:s.save||'DEX',dmg:s.kind==='autre'?'0':spellLine(c,D,s),dtype:s.dtype,half:!!s.half,slot:+s.lvl||0,note:[s.note||'',isConc((s.name))&&!/concentration/i.test(s.note||'')?'Concentration':''].filter(Boolean).join(' · ')})});
  itemActs(c,D).forEach(a=>acts.push(a));
  const slots={};D.slots.forEach((n,i)=>{slots[i+1]=[n,Math.min(n,+c.slotsUsed[i+1]||0)]});
  if(D.pact){const l=D.pact.lvl,u=Math.min(D.pact.n,+c.pactUsed||0);slots[l]=slots[l]?[slots[l][0]+D.pact.n,slots[l][1]+u]:[D.pact.n,u]}
  const pets=(c.pets||[]).map(p=>({pid:p.id,name:p.name||'Compagnon',hpMax:Math.max(1,+p.hpMax||1),ac:+p.ac||10,speed:+p.speed||9,initB:+p.initB||0,size:Math.max(1,Math.min(3,+p.size||1)),

function readPortrait(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{
  const k=Math.min(1,640/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
  ok(/png|webp|gif/i.test(file.type)?trimCanvas(cv):cv.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)})}
// recadre l'image sur le personnage (supprime les marges transparentes) pour qu'il soit centré dans l'arche
function trimCanvas(cv){const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return cv.toDataURL('image/png');const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png')}
function trimExisting(){DB.chars.forEach(c=>{if(!c.img||c.imgTrim||!/^data:image\/png/.test(c.img))return;const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);
  c.img=trimCanvas(cv);c.imgTrim=true;c.thumb=null;c.bust=null;makeThumb(c.img).then(t=>{c.thumb=t;save()});makeBust(c.img,c).then(t=>{c.bust=t;c.bustV=3;save()});try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}const y=window.scrollY;render();window.scrollTo(0,y)};im.src=c.img})}

function decoFrameP(src,id){const O='M50 1L66 12.5H83V18H99V157H83V162.5H66L50 174L34 162.5H17V157H1V18H17V12.5H34Z',I='M50 7L64 17H79V22.5H95V152.5H79V158H64L50 168L36 158H21V152.5H5V22.5H21V17H36Z';
  return `<svg viewBox="0 0 100 175" style="width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))" aria-label="Aperçu du cadrage"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17161b"/><stop offset=".45" stop-color="#1d1c22"/><stop offset="1" stop-color="#3e3b49"/></linearGradient><clipPath id="${id}k"><path d="${I}"/></clipPath></defs>
    <path d="${O}" fill="url(#${id}g)" stroke="#f3d6a4" stroke-width="3.4" stroke-linejoin="round"/><image id="${id}" href="${src||''}" x="0" y="14" width="100" height="161" preserveAspectRatio="xMidYMin slice" clip-path="url(#${id}k)"/><path d="${I}" fill="none" stroke="#f3d6a4" stroke-width="1.8" stroke-linejoin="round"/></svg>`}
function makeBust(src,o){return new Promise(ok=>{const im=new Image();im.onload=()=>{try{
  // 1) cadre du contenu (ignore le fond transparent ou blanc uni)
  const w=im.width,h=im.height,k=Math.min(1,400/Math.max(w,h)),sw0=Math.max(1,Math.round(w*k)),sh0=Math.max(1,Math.round(h*k)),c0=document.createElement('canvas');c0.width=sw0;c0.height=sh0;
  const g0=c0.getContext('2d');g0.drawImage(im,0,0,sw0,sh0);const d0=g0.getImageData(0,0,sw0,sh0).data;
  const bgPx=i=>d0[i+3]<20||(d0[i]>238&&d0[i+1]>238&&d0[i+2]>238);let x0=sw0,y0=sh0,x1=-1,y1=-1;
  for(let y=0;y<sh0;y++)for(let x=0;x<sw0;x++){if(!bgPx((y*sw0+x)*4)){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0){x0=0;y0=0;x1=sw0-1;y1=sh0-1}
  let bx=x0/k,by=y0/k,bw=(x1-x0+1)/k,bh=(y1-y0+1)/k;
  // 2) buste : toute la largeur, hauteur = 1,25 × largeur depuis le haut ; réglable (zoom, décalage)
  let cw=bw,ch=bw*1.61;if(ch>bh){ch=bh;cw=Math.min(bw,bh/1.61)}
  const z=Math.max(.5,Math.min(4,(+(o&&o.bustZ)||100)/100)),ox=(+(o&&o.bustX)||0)/100,oy=(+(o&&o.bustY)||0)/100;
  const mx=bx+bw/2+ox*cw,my=by+ch/2+oy*ch;cw/=z;ch/=z;
  const W=150,H=242,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const sc=Math.min(W/cw,H/ch),ox0=W/2-mx*sc,oy0=H/2-my*sc;g.drawImage(im,0,0,w,h,ox0,oy0,w*sc,h*sc);
  // 3) fond blanc uni relié aux bords → transparent
  const id=g.getImageData(0,0,W,H),d=id.data,wh=i=>d[i+3]>0&&d[i]>232&&d[i+1]>232&&d[i+2]>232;const seen=new Uint8Array(W*H),st=[];
  for(let x=0;x<W;x++){st.push(x,(H-1)*W+x)}for(let y=0;y<H;y++){st.push(y*W,y*W+W-1)}let n=0;
  while(st.length){const p=st.pop();if(seen[p])continue;seen[p]=1;if(!wh(p*4))continue;d[p*4+3]=0;n++;const x=p%W,y=(p-x)/W;if(x>0)st.push(p-1);if(x<W-1)st.push(p+1);if(y>0)st.push(p-W);if(y<H-1)st.push(p+W)}
  g.putImageData(id,0,0);ok(cv.toDataURL('image/png'))}catch(e){ok(null)}};im.onerror=()=>ok(null);im.src=src})}
function makeThumb(src){return new Promise(ok=>{const im=new Image();im.onload=()=>{const w=im.width,h=im.height,sd=Math.min(w,h),sx=(w-sd)/2,N=160,cv=document.createElement('canvas');cv.width=cv.height=N;
  cv.getContext('2d').drawImage(im,sx,0,sd,sd,0,0,N,N);ok(cv.toDataURL(/^data:image\/png/.test(src)?'image/png':'image/jpeg',.85))};im.onerror=()=>ok(null);im.src=src})}
function thumbExisting(){DB.chars.forEach(c=>{if(c.img&&!c.thumb)makeThumb(c.img).then(t=>{if(t){c.thumb=t;save()}});if(c.img&&(!c.bust||(c.bustV||0)<3))makeBust(c.img,c).then(t=>{if(t){c.bust=t;c.bustV=3;save()}})})}

function tokenImg(file,removeWhite){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{
  const MAX=256,k=Math.min(1,MAX/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.drawImage(im,0,0,w,h);const D=g.getImageData(0,0,w,h),p=D.data;
  if(removeWhite){const isBg=i=>{const R=p[i],G=p[i+1],B=p[i+2];return p[i+3]<20||(Math.min(R,G,B)>222&&Math.max(R,G,B)-Math.min(R,G,B)<26)};
    const seen=new Uint8Array(w*h),st=[];for(let x=0;x<w;x++)st.push(x,(h-1)*w+x);for(let y=0;y<h;y++)st.push(y*w,y*w+w-1);
    while(st.length){const n=st.pop();if(seen[n])continue;seen[n]=1;if(!isBg(n*4))continue;p[n*4+3]=0;const x=n%w,y=(n-x)/w;if(x>0)st.push(n-1);if(x<w-1)st.push(n+1);if(y>0)st.push(n-w);if(y<h-1)st.push(n+w)}
    g.putImageData(D,0,0)}
  let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(p[(y*w+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0){ok(cv.toDataURL('image/png'));return}const sd=Math.max(x1-x0+1,y1-y0+1),o=document.createElement('canvas');o.width=o.height=sd;
  o.getContext('2d').drawImage(cv,x0,y0,x1-x0+1,y1-y0+1,(sd-(x1-x0+1))/2,(sd-(y1-y0+1))/2,x1-x0+1,y1-y0+1);ok(o.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)})}

function setPath(c,path,val){const p=path.split('.');let o=c;for(let i=0;i<p.length-1;i++){const k=p[i];o=Array.isArray(o)?o.find(x=>x.id===k):o[k];if(!o)return}const last=p[p.length-1];
  if(Array.isArray(o)){return}o[last]=val}
const NUM=new Set(['hp','temp','atkB','dmgB','level','xp','hpMax','acBonus','acOverride','initBonus','speedOverride','magic','range','area','lvl','qty','max']);

  if(el.dataset.f==='level'){c.level=Math.max(1,Math.min(20,+c.level||1))}

  if(el.dataset.f.startsWith('base.')){const s=el.dataset.f.split('.')[1];c.base[s]=Math.max(1,Math.min(30,+c.base[s]||10))}
  if(el.dataset.f==='race'&&c.race!=='demielfe')c.raceAsi=[];
  if(el.dataset.f==='hp'||el.dataset.f==='temp'){const D=calc(c);c.hp=Math.max(0,Math.min(D.hpMax,+c.hp||0));c.temp=Math.max(0,+c.temp||0);if(c.hp>0){c.death={s:0,f:0};c.conds=(c.conds||[]).filter(k=>k!=='inconscient')}}
  if(el.dataset.f==='hpMax'||el.dataset.f==='level'||el.dataset.f.startsWith('base.CON')||el.dataset.f==='race'||el.dataset.f==='cls'){const D=calc(c);c.hp=Math.min(c.hp??D.hpMax,D.hpMax);if(el.dataset.f==='level'||el.dataset.f==='cls'||el.dataset.f==='race')c.hp=D.hpMax}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.tagName==='INPUT'&&b.type!=='checkbox')return;
  const a=b.dataset.a,v=b.dataset.v,c=curC(),y=window.scrollY;let keep=true;
  switch(a){
    case 'home':DB.cur=null;keep=false;break;
    case 'open':DB.cur=v;view.tab='combat';keep=false;break;
    case 'delpc':{const x=DB.chars.find(z=>z.id===v);if(!x)return;if(!confirm('Supprimer définitivement '+(fullName(x)||'ce personnage')+' ? Cette action est irréversible.'))return;
      if(DB.join&&DB.join.sheetId===v){const N=net();if(N)N.update(TP('players/'+N.uid),{online:false,left:true,cid:null}).catch(()=>{});DB.join=null;netConnect()}
      DB.chars=DB.chars.filter(z=>z.id!==v);if(DB.cur===v)DB.cur=null;keep=false;toast('Personnage supprimé');break}
    case 'new':{const n=newChar();DB.chars.push(n);DB.cur=n.id;view.tab='fiche';keep=false;toast('Choisis race, classe et niveau : le reste se calcule');break}
    case 'tab':view.tab=v;keep=false;break;
    case 'export':case 'joinT':return joinModal(c);
    case 'import':return importModal();
    case 'dmg':case 'heal':case 'temp':{const n=Math.max(0,+$('#hpN').value||0);if(!n){toast('Saisis un nombre');return}const D=calc(c);
      if(a==='dmg'){let r=n;if(c.temp){const t=Math.min(c.temp,r);c.temp-=t;r-=t}if(c.hp<=0&&r>0){c.death.f=Math.min(3,c.death.f+1);toast('Dégâts à 0 PV : un échec contre la mort')}
        c.hp=Math.max(0,c.hp-r);if(c.hp===0&&!c.conds.includes('inconscient')){c.conds.push('inconscient');toast('Tu tombes inconscient·e')}if(c.conc&&n>0)toast(`Concentration : JdS CON DD ${Math.max(10,Math.floor(n/2))}`)}
      if(a==='heal'){const was=c.hp;c.hp=Math.min(D.hpMax,c.hp+n);if(was<=0&&c.hp>0){c.death={s:0,f:0};c.conds=c.conds.filter(k=>k!=='inconscient')}}
      if(a==='temp')c.temp=Math.max(c.temp||0,n);break}
    case 'death':{const k=v,i=+b.dataset.i;c.death[k]=i<c.death[k]?i:i+1;if(c.death.s>=3)toast('Stabilisé·e');if(c.death.f>=3)toast('Ton personnage succombe…');break}

    case 'conc':c.conc=!c.conc;break;

function longRest(c){const D=calc(c);c.hp=D.hpMax;c.temp=0;c.slotsUsed={};c.pactUsed=0;c.resUsed={};c.hdUsed=Math.max(0,(+c.hdUsed||0)-Math.max(1,Math.floor(D.L/2)));c.death={s:0,f:0};c.conds=c.conds.filter(k=>k!=='inconscient');c.conc=false;save()}

  if(D1.prof>D0.prof)gains.push(`Bonus de maîtrise : ${sgn(D0.prof)} → <b>${sgn(D1.prof)}</b>`);
  for(let i=0;i<9;i++){const a=D0.slots[i]||0,b=D1.slots[i]||0;if(b>a)gains.push(a?`Emplacements de niveau ${i+1} : ${a} → <b>${b}</b>`:`<b>Nouveau :</b> sorts de niveau ${i+1} (${b} emplacement${b>1?'s':''})`)}

function listenChar(){const N=net();CON.charUn.forEach(u=>{try{u&&u()}catch(e){}});CON.charUn=[];if(!N||!CON.cid)return;
  CON.charUn.push(N.on(TP('live/'+CON.cid),L=>{if(L)applyLiveSheet(L)}));
  CON.charUn.push(N.on(TP('rolls/'+CON.cid),R=>{CON.rolls=R||{};grantsIn(R||{});showRolls()}))}
function applyLiveSheet(L){const c=myChar();if(!c)return;
  const norm={hp:+L.hp||0,conds:(L.conds||[]).slice().sort(),death:{s:+(L.death&&L.death.s)||0,f:+(L.death&&L.death.f)||0},slots:L.slots||{}};
  if(JSON.stringify(norm)===CON.cache)return;
  const D=calc(c),before=c.hp;c.hp=Math.max(0,Math.min(D.hpMax,norm.hp));c.conc=norm.conds.includes('concentration');c.conds=norm.conds.filter(k=>k!=='concentration');c.death=norm.death;
  Object.entries(norm.slots).forEach(([l,u])=>{l=+l;const n=D.slots[l-1]||0;let used=+u||0;
    if(D.pact&&D.pact.lvl===l){const pu=Math.min(D.pact.n,Math.max(0,used-n));c.pactUsed=pu;used-=pu}if(n)c.slotsUsed[l]=Math.min(n,used)});
  CON.cache=JSON.stringify(liveOfSheet(c));saveLocal();
  if(before!=null&&c.hp<before)toast(`Tu perds ${before-c.hp} PV`);else if(before!=null&&c.hp>before)toast(`Tu récupères ${c.hp-before} PV`);
  if(!$('#modalRoot').innerHTML&&DB.cur===c.id){const y=window.scrollY;render();window.scrollTo(0,y)}else softRefresh()}
function schedulePush(){clearTimeout(CON.timer);CON.timer=setTimeout(()=>pushSheet(false),300)}
function pushSheet(force){const N=net(),c=myChar();if(!N||!c)return;
  const sum=combatSummary(c),sig=JSON.stringify({...sum,hp:0,conds:[],slots:Object.fromEntries(Object.entries(sum.slots).map(([l,v])=>[l,v[0]]))});
  if(force||sig!==CON.sumJ){CON.sumJ=sig;const cl=CON.claim;CON.claim=false;N.update(TP('players/'+N.uid),Object.assign({name:DB.join.pseudo||c.player||'Joueur',combat:sum,ts:Date.now(),online:true},DB.join.rejoin?{kicked:false,left:false}:{},cl?{claim:Date.now()}:{})).then(()=>{if(DB.join&&DB.join.rejoin){delete DB.join.rejoin;saveLocal()}}).catch(e=>toast('Connexion refusée par la table'))}
  if(CON.cid){const L=liveOfSheet(c),j=JSON.stringify(L);if(j!==CON.cache){CON.cache=j;N.set(TP('live/'+CON.cid),L).catch(()=>{})}}}

/* ---------- Niveau : barre d'XP, animation et son ---------- */
const inCombat=()=>!!(CON.view&&CON.view.cur);
function xpBar(c){const L=Math.max(1,Math.min(20,+c.level||1)),x=+c.xp||0;if(L>=20)return `<div class="xpb"><i style="width:100%"></i></div><small class="xpl">Niveau maximum</small>`;
  const a=XP_T[L-1],b=XP_T[L],p=Math.max(0,Math.min(1,(x-a)/(b-a)));return `<div class="xpb ${p>=1?'full':''}" title="${x.toLocaleString('fr-FR')} / ${b.toLocaleString('fr-FR')} XP"><i style="width:${(p*100).toFixed(1)}%"></i></div><small class="xpl">${p>=1?`✦ Niveau ${L+1} disponible${inCombat()?' après le combat':''}`:`Niveau ${L+1}`}</small>`}

const LVA={x:null,buf:{},out:null,rev:null,dec:null};
function lvAudio(){if(LVA.x)return LVA.x;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;const x=new AC();LVA.x=x;LVA.out=x.createGain();LVA.out.gain.value=.9;LVA.out.connect(x.destination);
  const len=Math.round(x.sampleRate*2.4),ir=x.createBuffer(2,len,x.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
  LVA.rev=x.createConvolver();LVA.rev.buffer=ir;const ro=x.createGain();ro.gain.value=.55;LVA.rev.connect(ro);ro.connect(LVA.out);
  LVA.dec=Promise.all(Object.entries(LVSMP).map(async([k,arr])=>{LVA.buf[k]=[];for(const b64 of arr){try{const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));LVA.buf[k].push(await new Promise((ok,ko)=>x.decodeAudioData(bin.buffer,ok,ko)))}catch(e){}}}));return x}catch(e){return null}}
document.addEventListener('pointerdown',()=>{const x=lvAudio();if(x&&x.state==='suspended')x.resume().catch(()=>{})},{passive:true});
function lvSmp(k,t,{g=1,rate=1,rev=0}={}){const L=LVA.buf[k],x=LVA.x;if(!L||!L.length)return;const s=x.createBufferSource();s.buffer=L[Math.floor(Math.random()*L.length)];s.playbackRate.value=rate*(1+(Math.random()*2-1)*.06);
  const gn=x.createGain();gn.gain.value=g;s.connect(gn);gn.connect(LVA.out);if(rev){const r=x.createGain();r.gain.value=rev;gn.connect(r);r.connect(LVA.rev)}s.start(t)}
// son du gain de niveau fourni par le MJ (levelup.mp3), sinon le son de l'app MJ
function lvFile(){if(LVA.file!==undefined)return LVA.file;const x=lvAudio();if(!x)return LVA.file=Promise.resolve(null);
  return LVA.file=fetch('levelup.mp3?v=1').then(r=>r.ok?r.arrayBuffer():null).then(ab=>ab?new Promise((ok,ko)=>x.decodeAudioData(ab,ok,ko)):null).catch(()=>null)}
document.addEventListener('pointerdown',()=>{try{lvFile()}catch(e){}},{passive:true,once:true});
function lvlSnd(){const x=lvAudio();if(!x)return;(x.state==='suspended'?x.resume():Promise.resolve()).catch(()=>{}).then(()=>lvFile()).then(b=>{if(!b){lvlSndMJ();return}const s=x.createBufferSource();s.buffer=b;const g=x.createGain();g.gain.value=1;s.connect(g);g.connect(LVA.out);s.start(x.currentTime+.02)})}
function lvlSndMJ(){const x=lvAudio();if(!x)return;(x.state==='suspended'?x.resume():Promise.resolve()).catch(()=>{}).then(()=>LVA.dec).then(()=>{const t=x.currentTime+.02;
  [1,1.26,1.5,2].forEach((r,i)=>lvSmp('bell',t+i*.12,{rate:r,g:.45,rev:.6}));lvSmp('chime',t+.5,{g:.5,rate:1,rev:.7});lvSmp('chime',t+.62,{g:.4,rate:1.5,rev:.7});lvSmp('field',t+.4,{g:.3,rate:1.6,rev:.6})})}

    const vx=x+.5-ox,vy=y+.5-oy,t=vx*dx+vy*dy;if(t<=.2||t>L+.05)continue;const perp=Math.abs(vx*dy-vy*dx);if(a.sh==='line'?perp<=.55:perp<=t*.5+.3)out.push(x+','+y)}return out}
function pmPick(x,y){const o=CON.pm,t=CON.turn;if(!o||!t)return;const info=$('#pmInfo'),ok=$('#modalRoot [data-x=ok]');let sel=null,msg='';
  if(o.mode==='move'){const r=t.reach.find(([a,b])=>a===x&&b===y);if(r){sel={x,y};msg=`Aller ici : ${fm(r[2])}`+((t.aoo||[]).includes(x+','+y)?' · attaque d’opportunité possible !':'')}else msg='Case hors de portée de déplacement'}
  else if(o.mode==='area'&&o.act.sh){const me=t.me;if(x>=me[0]&&x<me[0]+me[2]&&y>=me[1]&&y<me[1]+me[2]){msg='Touche une case dans la direction voulue';}else{sel={x,y};const K=new Set(shapeKeysP(o.act,sel,CON.pmap));const hit=t.toks.filter(k=>k.id!==CON.cid&&[...Array((k.s||1)*(k.s||1))].some((_,i)=>K.has((k.x+i%(k.s||1))+','+(k.y+Math.floor(i/(k.s||1))))));msg=(o.act.sh==='cone'?'Cône':'Ligne')+' de '+fm(o.act.L)+' · '+(hit.length?'touche : '+hit.map(k=>k.n).join(', '):'personne dedans')}}
  else if(o.mode==='area'&&o.cell){const rng=Math.max(1,Math.floor((o.act.range||1.5)/1.5+1e-9));const occ=t.toks.some(k=>x>=k.x&&x<k.x+(k.s||1)&&y>=k.y&&y<k.y+(k.s||1));if(cdist(x,y,1)>rng)msg='Trop loin';else if(occ&&o.act.tp)msg='Case occupée';else{sel={x,y};msg=o.act.tp?'Destination choisie':'Case choisie'}}
  else if(o.mode==='area'){if(o.self)return;const rng=Math.max(1,Math.floor((o.act.range||1.5)/1.5+1e-9));if(cdist(x,y,1)<=rng){sel={x,y};const ar=Math.floor(o.act.area/1.5+1e-9),hit=t.toks.filter(k=>Math.max(gapC(x-ar,2*ar+1,k.x,k.s||1),gapC(y-ar,2*ar+1,k.y,k.s||1))===0);msg=hit.length?'Dans la zone : '+hit.map(k=>k.n).join(', '):'Personne dans la zone'}else msg='Hors de portée'}
  else{const rng=Math.max(1,Math.floor((o.act.range||1.5)/1.5+1e-9));const k=t.toks.find(k=>x>=k.x&&x<k.x+(k.s||1)&&y>=k.y&&y<k.y+(k.s||1))||t.objs.find(k=>k.x===x&&k.y===y);
    if(!k)msg='Touche une créature';else if(k.id!==CON.cid&&cdist(k.x,k.y,k.s||1)>rng)msg=k.n+' est hors de portée';else{sel={id:k.id,x,y};msg='Cible : '+k.n}}
  o.sel=sel;if(info)info.textContent=msg;if(ok)ok.disabled=!sel;drawPM(false)}

function conBar(c){if(!DB.join||!DB.join.tid||!joined()||myChar()!==c)return '';const N=net(),v=CON.view,petT=!!(CON.turn&&CON.turn.own===CON.cid&&CON.turn.cid!==CON.cid&&v&&v.cur===CON.turn.cid),mine=v&&CON.cid&&(v.cur===CON.cid||petT);
  const order=(v&&v.order)||[];const curN=order.find(o=>o.cid===(v&&v.cur));
  return `<div class="card con ${mine?'mine':''}"><div class="row" style="justify-content:space-between"><span><span class="dot ${N?'on':''}" style="background:${!N?'var(--foe)':CON.conn===false?'#e0a030':'var(--ok)'}"></span> ${!N?'Hors ligne :':CON.conn===false?'Reconnexion à':'Connecté à'} <b>${esc((CON.meta&&CON.meta.name)||'la table')}</b></span><button class="btn sm" data-a="leave" type="button">Quitter</button></div><div class="sub" style="opacity:.6;font-size:11px">version ${esc(window.APP_V||'?')}</div>
    ${!CON.cid&&CON.lost?'<div class="sub">Ta fiche est active sur un autre appareil ou onglet.</div><div class="row"><button class="btn primary" data-a="reclaim" type="button">Jouer sur cet appareil</button></div>':!CON.cid?'<div class="sub">En attente du MJ…</div>':mine?(petT?`<div class="turn">Tour de ${esc(CON.turn.nm||'ton compagnon')} !</div>`:'<div class="turn">C’est ton tour !</div>')+turnPanel():v&&v.round?`<div class="sub">Round ${v.round} · tour de ${esc(curN?curN.name:'—')}</div>`:'<div class="sub">Le combat n’a pas commencé.</div>'}
    ${order.length?`<div class="ord">${order.map(o=>`<span class="oc ${o.cid===v.cur?'cur':''} ${o.cid===CON.cid?'me':''} ${o.side}"><b>${esc(o.name)}</b><small>${o.side==='pj'?o.hp+' / '+o.hpMax+' PV':esc(o.st)}</small></span>`).join('')}</div>`:''}</div>`}
function joinCard(){if(!DB.join||!DB.join.tid||joined())return '';const N=window.NET;
  return `<div class="card con mine"><h3>Invitation</h3><div style="font-family:var(--f-display);font-size:24px;line-height:1.1" data-live="tname">${esc((CON.meta&&CON.meta.name)||'Une table de jeu')}</div>
    ${!N?'<p class="sub" style="margin:0">Connexion en cours…</p>':N.ready&&CON.metaSeen&&!CON.meta?`<p class="sub" style="margin:0;color:var(--foe)">Aucune table avec ce code. Vérifie-le auprès du MJ.</p><div class="row"><button class="btn" data-a="decline" type="button">Changer de code</button></div>`:''}
    ${N&&!N.ready?`<p class="sub" style="margin:0">Connexion impossible (${N.reason==='config'?'lien d’invitation incomplet : redemande le lien au MJ':esc(N.error||'erreur réseau')}).</p>`:''}
    ${DB.chars.length?`<label class="fld">Ton personnage<select class="in" id="jSheet">${DB.chars.map(c=>`<option value="${c.id}">${esc(fullName(c))} · ${esc(calc(c).K.n)} ${calc(c).L}</option>`).join('')}</select></label>
      <label class="fld">Ton prénom (vu par le MJ)<input class="in" id="jPseudo" value="${esc(DB.join.pseudo||DB.pseudo||'')}" placeholder="Ex. Léa"></label>
      <div class="row"><button class="btn primary" data-a="join" type="button">Rejoindre la table</button><button class="btn" data-a="decline" type="button">Plus tard</button></div>`
      :`<p class="sub" style="margin:0">Crée d’abord ton personnage, puis reviens ici pour rejoindre la table.</p>`}</div>`}
window.addEventListener('net-ready',netConnect);

render();
})();
</script>
